name: Publish images

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild and re-publish the image for an existing Lodestar release (no PR, no GitHub release)'
        type: boolean
        default: true
      lodestar_version:
        description: 'Lodestar release tag to rebuild, e.g. v1.50.0 (empty = latest upstream release)'
        type: string
        default: ''
      node_image:
        description: 'Node.js image whose node binary replaces the one in the Lodestar image'
        type: string
        default: 'node:24-slim'
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight

jobs:
  push_lodestar-validator:
    name: Publish Lodestar Validator image
    runs-on: ubuntu-latest
    
    permissions:
      packages: write
      id-token: write
      attestations: write
      contents: write
      pull-requests: write

    steps:      
      # checks latest release from external repo
      - id: base
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: ChainSafe/lodestar
          excludes: prerelease, draft
      
      # Release to build: manual input if given, otherwise the latest upstream release
      - id: version
        run: |
          echo "release=${{ inputs.lodestar_version || steps.base.outputs.release }}" >> "$GITHUB_OUTPUT"
          echo "rebuild=${{ github.event_name == 'workflow_dispatch' && inputs.rebuild }}" >> "$GITHUB_OUTPUT"

      - uses: action-pack/tag-exists@v1
        id: check
        with: 
          tag: ${{ steps.version.outputs.release }}

      - name: Exit if tag exists
        if: ${{ steps.check.outputs.exists == 'true' && steps.version.outputs.rebuild != 'true' }}
        run: |
          echo "Update dockerfile to ${{ steps.version.outputs.release }} already exists" 
          exit 1

      - name: Check out the repo
        uses: actions/checkout@v7

      # Create a new dockerfile from template with new version
      - id: sub
        uses: bluwy/substitute-string-action@v4
        with:
          _input-file: Dockerfile.template
          _output-file: Dockerfile
          LODESTAR_VERSION: ${{ steps.version.outputs.release }}

      - name: Create Pull Request
        if: ${{ steps.check.outputs.exists == 'false' && steps.version.outputs.rebuild != 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update-lodestar-${{ steps.version.outputs.release }}
          title: "Update Lodestar to ${{ steps.version.outputs.release }}"
          body: |
            ## Automated Update
            
            This PR updates the Lodestar version to **${{ steps.version.outputs.release }}**.
            
            ### Changes
            - Updated Dockerfile with new Lodestar version
            - Generated from Dockerfile.template
            
            ### Upstream Release
            ${{ steps.base.outputs.description }}
            
            ---
            *This PR was automatically created by the CI/CD workflow*
          commit-message: "Update dockerfile to ${{ steps.version.outputs.release }}"
          delete-branch: true
          labels: |
            automated
            dependencies
            lodestar-update

      - name: Auto-merge Pull Request
        if: ${{ steps.check.outputs.exists == 'false' && steps.version.outputs.rebuild != 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: context.repo.owner + ':update-lodestar-' + '${{ steps.version.outputs.release }}'
            });
            
            if (pullRequests.length > 0) {
              const pr = pullRequests[0];
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log(`Auto-merged PR #${pr.number}`);
            }

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/lodestar-validator
          tags: |
            type=raw,value=${{ steps.version.outputs.release }}
            type=raw,value=${{ steps.version.outputs.release }}-r${{ github.run_number }},enable=${{ steps.version.outputs.rebuild == 'true' }}

      - name: Build and push Lodestar Validator
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          file: Dockerfile
          build-args: |
            NODE_IMAGE=${{ inputs.node_image || 'node:24-slim' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
      - name: attest
        uses: actions/attest-build-provenance@v4
        id: attest
        with:
          subject-name: ghcr.io/${{ github.repository }}/lodestar-validator
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create Release
        id: create-release
        uses: action-pack/github-release@v2
        if: ${{ steps.check.outputs.exists == 'false' && steps.version.outputs.rebuild != 'true' }}
        with:
          tag: ${{ steps.version.outputs.release }}
          title: Upstream-${{ steps.version.outputs.release }}
          body: ${{ steps.base.outputs.description }}